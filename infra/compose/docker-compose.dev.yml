version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: pay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pay
    ports:
      - '5432:5432'
    volumes:
      - pay-postgres-data:/var/lib/postgresql/data

volumes:
  pay-postgres-data:
